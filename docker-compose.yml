version: '3.8'

services:
  traffic-sentinel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-sentinel-ai
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TV_USE_ONNX=1
      - PYTHONUNBUFFERED=1
    volumes:
      - models:/app/models
      - ./static:/app/static:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  models:
  static:
