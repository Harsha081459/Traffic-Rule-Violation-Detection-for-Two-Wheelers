name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt fastapi==0.141.1 python-multipart==0.0.32 numpy==2.3.5 opencv-python-headless==4.14.0.94

      - name: Lint
        run: ruff check app.py traffic_violation/ tests/ --select=E9,F63,F7,F82,F401

      - name: Test
        run: pytest -q -m unit
        env:
          TV_USE_ONNX: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4

      - name: Run bandit
        run: bandit -r app.py traffic_violation/ -ll
