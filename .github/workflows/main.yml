name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Code Quality & Linting
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest

      - name: Check formatting with black
        run: black --check app.py static/main.js traffic_violation/ tests/ || true

      - name: Lint with ruff
        run: ruff check app.py traffic_violation/ tests/ --select=E,W,F,N

  # ────────────────────────────────────────────────────────────────────────
  # Unit Tests
  # ────────────────────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pytest pytest-asyncio httpx pydantic

      - name: Run pytest
        run: pytest tests/test_api.py -v --tb=short -m unit

  # ────────────────────────────────────────────────────────────────────────
  # Docker Build & Push
  # ────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image build
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build . --tag test-image:latest

  # ────────────────────────────────────────────────────────────────────────
  # Compose Test
  # ────────────────────────────────────────────────────────────────────────
  compose-test:
    name: Test Docker Compose Setup
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build image for compose
        run: docker buildx build . --tag traffic-sentinel-ai:latest --load

      - name: Test docker-compose up
        run: |
          docker-compose up -d
          sleep 5
          curl -f http://localhost:8000/api/health || exit 1
          docker-compose down

  # ────────────────────────────────────────────────────────────────────────
  # Security Scanning
  # ────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit
        run: bandit -r app.py traffic_violation/ tests/ -ll || true

      - name: Check known vulnerabilities
        run: safety check --json || true

  # ────────────────────────────────────────────────────────────────────────
  # Report / Summary
  # ────────────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker, compose-test, security]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          echo "✓ Lint checks"
          echo "✓ Unit tests"
          echo "✓ Docker build"
          echo "✓ Compose test"
          echo "✓ Security scan"
          echo ""
          echo "Pipeline complete. Ready for deployment."
